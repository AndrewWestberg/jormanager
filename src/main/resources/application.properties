#################################################
# Global Settings (ignore these for now)
#################################################
server.port=8080
spring.jmx.enabled=false
endpoints.enabled=true
endpoints.health.enabled=true
endpoints.shutdown.sensitive=false
endpoints.shutdown.enabled=false
management.security.enabled=false
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(:){faint} %m%n%wEx
#################################################
# JorManager Settings
#################################################
jormanager.admin.username=admin
# admin password hash for JorManager
# To generate, run
# $ ./jormanager.jar passwd
# To test your password, run
# $ ./jormanager.jar passwdtest '$argon2id$v=19$m=4096,t=3,p=1$ce4OFwws/HLvGe9d6SrirQ$Mm6ylvTOqGB8v+rzldru2zcvWnT/1dCB51i/GgRe6uP'
jormanager.admin.password=$argon2id$v=19$m=4096,t=3,p=1$ce4OFwws/HLvGe9d6SrirQ$Mm6ylvTOqGB8v+rzldru2zcvWnT/1dCB51i/GgRe6uP
#
# Random jwt token used to encrypt things. Change this to your own thing. This one is "I bless the rains down in Africa"
jormanager.jwt.secret={argon2}$argon2id$v=19$m=4096,t=3,p=1$sSYbkD0DSZMr9q90bIbMZA$ktElyrBhz+kMXtbAlc7sXtqPbvWoHJcH5+oHWEkfJWE
#
# How long the jwt token is valid for
jormanager.jwt.expiration=365d
#
# number of jormungandr nodes to spin up
jormanager.nodecount=10
#
# To make a node passive (never assigned leadership and never firewall protected), set it to true
jormanager.node.passive=false, false, false, false, false, false, false, false, false, false
#
# If this value is true, JorManager will run all nodes as leader-candidates, but never actually promote a leader.
# Useful if a main server goes down and you need to quickly change this value to spin up a backup server.
jormanager.standby.mode=false
#
# Time to allow the REST interface of jormungandr to respond before we timeout. This will be used only AFTER bootstrap.
# Before bootstrap is done, we allow the node 15000ms to respond on the rest api as bootstrap is CPU intensive.
jormanager.nodestats_timeout=10s
#
# If enabled, will only spin up the next node once the previous one successfully bootstraps.
jormanager.node_stagger_by_bootstrap=false
#
# number of milliseconds to stagger node startup (default 10 seconds)
jormanager.node_stagger=10s
#
# milliseconds between each new leader election cycle
jormanager.leader_election_delay=20s
#
# max blocks behind the leader a node can be and not be killed
jormanager.max_blocks_behind=5
#
# uptime in seconds to allow a node to be behind leader before we start checking (default 8 mins)
jormanager.node_probation=8m
#
# Number of times in a row API call can fail before we just restart the node (default: two failures allowed, third failure will restart the node)
jormanager.node_sequential_api_failures_allowed=2
#
# time in milliseconds to let a node flounder during bootstrapping before we kill it and try again (default 5 mins)
jormanager.max_bootstrap=5m
#
# if enabled, increment the public_id of each node starting up by 0x1
jormanager.increment.public_id.enabled=false
#
# minimum number of peers a node has before we take rate of peer change (standard deviation) into health calculation.
# if the node has at least the minimum number of peers, calculate the standard deviation of change in peers over the last
# 20 minutes. If the latest change in peers is more than badsdlimit number of standard deviations away from the mean,
# consider this a connection bombed peer and don't promote it to leader.
jormanager.minpeers.sdcalculation.enabled=true
jormanager.minpeers.sdcalculation=100
jormanager.minpeers.badsdlimit=1.4
#
# If a node is ever behind the tip during leader election, it gets put on probation. It will not be allowed to become
# a leader until the probation period is up. Default is 5 minutes after its last infraction. Probation can only be ignored
# if there are no other leaders capable of taking over (They're not on tip and the probation node is).
jormanager.leadership.probation.enabled=true
jormanager.leadership.probation.duration=5m
#
# settings for pooltool
jormanager.pooltool.enabled=true
jormanager.pooltool.jormver.enabled=true
jormanager.pooltool.delay=20s
jormanager.pooltool.poolId=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
jormanager.pooltool.userId=deadbeef-dead-dead-dead-deadbeefdead
jormanager.pooltool.genesisPref=8e4d2a343f3dcf93
jormanager.pooltool.keystorage=/tmp/keystorage
#
# location for the historical block log. This keeps track of blocks you've minted. If it doesn't exist yet, create it
# and put an empty array inside it `echo "[]" > /var/www/html/blocks.json`
jormanager.block_log=/var/www/html/blocks.json
#
# location for the current cluster stats. This can be used to drive dashboards
jormanager.stats_log=/var/www/html/jormanager-stats.json
#
# location to output this jormanager's peers that can be copy/pasted into some other config. Useful if you run without
# a public_id. This will pull the generated public_id from the nodes
jormanager.peers.output.enabled=false
jormanager.peers.output_ip=111.222.333.444
jormanager.peers.output_port=33{pid}
jormanager.peers.output_log=/home/westbam/cardano/peers.yaml
#
# Enable/disable management of ufw firewall. By enabling/disabling firewall access to our jormungandr instance,
# we take load off of jormungandr having to reject so many incoming connections when we're close to our max connections.
# note: the user that jormanager runs under must have no-password sudo access to the ufw command.
# $ sudo visudo
# ** add the line something like... **
# westbam ALL=NOPASSWD: /usr/sbin/ufw
jormanager.ufw.enabled=false
jormanager.ufw.passive.enabled=false
jormanager.ufw.allow=/usr/bin/sudo /usr/sbin/ufw allow 33{pid}/tcp
jormanager.ufw.deny=/usr/bin/sudo /usr/sbin/ufw reject 33{pid}/tcp
#
# Open up firewall if node connections drops below this number
jormanager.ufw.lower_limit=100
#
# Close off firewall if node connections climbs above this number
jormanager.ufw.upper_limit=120
#
# Enable/disable changing process priority during block minting. If enabled, we set the leader process to a higher priority
# and return it back to lower after the block has been minted. You will need to setup no-password sudo access to the
# utility you use to modify the priority. In the default case, this is renice.
# note: the user that jormanager runs under must have no-password sudo access to the ufw command.
# $ sudo visudo
# ** add the line something like... **
# westbam ALL=NOPASSWD: /usr/bin/renice
jormanager.processpriority.enabled=false
jormanager.processpriority.high=/usr/bin/sudo /usr/bin/renice -n -19 -p {pid}
jormanager.processpriority.normal=/usr/bin/sudo /usr/bin/renice -n 0 -p {pid}
#
# Use ss command to estimate connected peers instead of jcli network stats get rest call
jormanager.lightweight.peercount=true
#
# path to the kill command. Don't override unless you know what you're doing or are a Windows user
jormanager.kill.path=kill
#################################################
# Jormungandr Settings
#################################################
#
# Path to the jormungandr executable. You can omit pid, but I like to have multiple copies of the exe so you can see
# them in `top`. pid is zero-padded to 2 chars
jormanager.jormungandr.process=/home/westbam/.cargo/bin/jormungandr{pid}
#
# Path to the jormungandr storage folder.
jormanager.jormungandr.storage=/home/westbam/cardano/storage{pid}
#
# node config file location. pid is zero-padded to 2 chars
jormanager.jormungandr.config=/home/westbam/cardano/itn_rewards_v1-config{pid}.yaml
#
# genesis hash to use when starting jormungandr
jormanager.jormungandr.genesis=8e4d2a343f3dcf9330ad9035b3e8d168e6728904262f2c434a4f8f934ec7b676
#
# path to the secret file for this stakepool
jormanager.jormungandr.secret=/home/westbam/cardano/bluecheesestakehouse_poolsecret.yaml
#
# path to the secret file for this stakepool in json format. We need to use the json format when promoting a node to leader
jormanager.jormungandr.secret_json=/home/westbam/cardano/bluecheesestakehouse_poolsecret.json
#
# Rest Api URL pattern for jormungandr. Process 4 would be: http://127.0.0.1:3404/api/, Process 27 would be http://127.0.0.1:3427/api/
# pid is zero-padded to 2 chars
jormanager.jormungandr.rest_api_url=http://127.0.0.1:34{pid}/api/
#
# Jormungandr log file location. pid is zero-padded to 2 chars
jormanager.jormungandr.log_location=/home/westbam/cardano/jormungandr{pid}.log

