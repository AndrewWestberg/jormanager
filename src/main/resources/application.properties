#################################################
# Global Settings
#################################################
server.port = 8080
spring.jmx.enabled = false
endpoints.enabled = true
endpoints.health.enabled = true
endpoints.shutdown.sensitive = false
endpoints.shutdown.enabled = false
management.security.enabled = false

logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(:){faint} %m%n%wEx

#################################################
# JorManager Settings
#################################################

#
# number of jormungandr nodes to spin up
jormanager.nodecount = 10
#####
# number of milliseconds to stagger node startup (default 10 seconds)
jormanager.node_stagger_ms = 10000
#
# milliseconds between each new leader election cycle
jormanager.leader_election_delay_ms = 20000
#
# max blocks behind the leader a node can be and not be killed
jormanager.max_blocks_behind = 3
#
# uptime in seconds to allow a node to be behind leader before we start checking (default 2 mins)
jormanager.node_probation_secs = 120
#
# time in milliseconds to let a node flounder during bootstrapping before we kill it and try again (default 5 mins)
jormanager.max_bootstrap_ms = 300000
#
# number of peers a node has when we consider it "healthy"
jormanager.healthy_peers = 248
#
# settings for pooltool
jormanager.pooltool.poolId = deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
jormanager.pooltool.userId = deadbeef-dead-dead-dead-deadbeefdead
jormanager.pooltool.genesisPref = 8e4d2a343f3dcf93
#
# location for the historical block log. This keeps track of blocks you've minted. If it doesn't exist yet, create it
# and put an empty array inside it `echo "[]" > /var/www/html/blocks.json`
jormanager.block_log = /var/www/html/blocks.json
#
# location for the current cluster stats. This can be used to drive dashboards
jormanager.stats_log = /var/www/html/jormanager-stats.json

#################################################
# Jormungandr Settings
#################################################
#
# Path to the jormungandr executable. You can omit pid, but I like to have multiple copies of the exe so you can see
# them in `top`. pid is zero-padded to 2 chars
jormanager.jormungandr.process = /home/westbam/.cargo/bin/jormungandr{pid}
#
# node config file location. pid is zero-padded to 2 chars
jormanager.jormungandr.config = /home/westbam/cardano/itn_rewards_v1-config{pid}.yaml
#
# genesis hash to use when starting jormungandr
jormanager.jormungandr.genesis = 8e4d2a343f3dcf9330ad9035b3e8d168e6728904262f2c434a4f8f934ec7b676
#
# path to the secret file for this stakepool
jormanager.jormungandr.secret = /home/westbam/cardano/bluecheesestakehouse_poolsecret.yaml
#
# path to the secret file for this stakepool in json format. We need to use the json format when promoting a node to leader
jormanager.jormungandr.secret_json = /home/westbam/cardano/bluecheesestakehouse_poolsecret.json
#
# Rest Api URL pattern for jormungandr. Process 4 would be: http://127.0.0.1:3404/api/, Process 27 would be http://127.0.0.1:3427/api/
# pid is zero-padded to 2 chars
jormanager.jormungandr.rest_api_url = http://127.0.0.1:34{pid}/api/
#
# Jormungandr log file location. pid is zero-padded to 2 chars
jormanager.jormungandr.log_location = /home/westbam/cardano/jormungandr{pid}.log

