<body class="landing is-preload">
    <!-- Page Wrapper -->
    <div id="page-wrapper">
        <!-- Header -->
        <header id="header" class="alt">
            <h1><a href="index.html">JorManager Blocks</a></h1>
        </header>
        <!-- One -->
        <section id="one" class="wrapper style3 special">
            <div class="inner table-wrapper">
                <header class="major">
                    <h2>JorManager Block Log</h2>
                </header>
                <div class="wrapper style3">
                	<form action="index.html" method="get">
                		<select class="epoch_select" name="epoch" onchange="this.form.submit()">
                		</select>
                	</form>
	                <div class="row">
	                	<div class="col-6">
	                		<h6>Pending</h6>
	                		<p class="pending" style="font-weight: bolder;">&nbsp;</p>
	                	</div>
	                	<div class="col-6">
	                		<h6>Minted</h6>
	                		<p class="minted" style="font-weight: bolder;">&nbsp;</p>
	                	</div>
	                </div>
	                <div class="row">
	                	<div class="col-6">
	                		<h6>Sniped</h6>
	                		<p class="sniped" style="font-weight: bolder;">&nbsp;</p>
	                	</div>
	                	<div class="col-6">
	                		<h6>Missed</h6>
	                		<p class="missed" style="font-weight: bolder;">&nbsp;</p>
	                	</div>
	                </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Block No.</th>
                            <th>Epoch.Slot</th>
                            <th>Scheduled</th>
                            <th>Status</th>
                            <th>Block</th>
                        </tr>
                    </thead>
                    <tbody class="blocks_tbody">
                    </tbody>
                </table>
            </div>
