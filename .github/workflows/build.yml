name: CI Build

on:
  push:
    branches: [ "develop", "dijkstra", "main", "master" ]
  pull_request:
    branches: [ "develop", "dijkstra", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Install frontend dependencies
        working-directory: vue
        run: npm ci

      - name: Lint frontend
        working-directory: vue
        run: npm run lint:check

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install IOG libsodium for VRF tests
        run: |
          cd "$(mktemp -d "$RUNNER_TEMP/libsodium.XXXXXX")"
          git init -q
          git fetch --depth=1 https://github.com/input-output-hk/libsodium.git dbb48cce5429cb6585c9034f002568964f1ce567
          git checkout --detach FETCH_HEAD
          DO_NOT_UPDATE_CONFIG_SCRIPTS=1 ./autogen.sh
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Check formatting, run tests, and build
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: ./gradlew ktlintCheck test bootJar --build-cache --stacktrace

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-reports
          path: |
            build/reports/ktlint/
            build/reports/tests/
            build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore
