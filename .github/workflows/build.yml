name: CI Build

on:
  push:
    branches: [ "develop", "dijkstra", "main", "master" ]
  pull_request:
    branches: [ "develop", "dijkstra", "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  osv-scan:
    name: Scan Lockfiles (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get UTC date for OSV database cache
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache OSV offline databases
        uses: actions/cache@v6
        with:
          path: .osv-cache
          key: osv-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            osv-db-${{ runner.os }}-

      - name: Scan npm and Gradle lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        env:
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: .osv-cache
        with:
          scan-args: |-
            --offline
            --download-offline-databases
            --lockfile=vue/package-lock.json
            --lockfile=gradle.lockfile

      - name: Normalize OSV cache permissions
        if: always()
        run: |
          if [ -d .osv-cache ]; then
            sudo chown -R "$USER:$USER" .osv-cache
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: vue/package-lock.json

      - name: Install frontend dependencies
        id: install
        working-directory: vue
        run: npm ci

      - name: Lint frontend
        working-directory: vue
        run: npm run lint:check

      - name: Type-check frontend
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: vue
        run: npx vue-tsc --noEmit

      - name: Test frontend
        if: (success() || failure()) && steps.install.outcome == 'success'
        working-directory: vue
        run: npm run test

      - name: Build frontend assets
        working-directory: vue
        run: npx vite build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: vue/dist/
          retention-days: 1
          if-no-files-found: error

      - name: Upload frontend reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: build/reports/vue-tests/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache IOG libsodium prefix
        uses: actions/cache@v6
        with:
          path: ~/.cache/iog-libsodium-dbb48cce
          key: iog-libsodium-${{ runner.os }}-${{ runner.arch }}-dbb48cce5429cb6585c9034f002568964f1ce567

      - name: Build IOG libsodium on cache miss
        run: |
          LIBSODIUM_PREFIX="$HOME/.cache/iog-libsodium-dbb48cce"
          if [ ! -f "$LIBSODIUM_PREFIX/lib/libsodium.so" ] || [ ! -f "$LIBSODIUM_PREFIX/include/sodium.h" ]; then
            rm -rf "$LIBSODIUM_PREFIX"
            BUILD_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/libsodium.XXXXXX")"
            trap 'rm -rf "$BUILD_DIR"' EXIT
            cd "$BUILD_DIR"
            git init -q
            git fetch --depth=1 https://github.com/input-output-hk/libsodium.git dbb48cce5429cb6585c9034f002568964f1ce567
            git checkout --detach FETCH_HEAD
            DO_NOT_UPDATE_CONFIG_SCRIPTS=1 ./autogen.sh
            ./configure --prefix="$LIBSODIUM_PREFIX"
            make -j"$(nproc)"
            make install
          fi

      - name: Install IOG libsodium for VRF tests
        run: |
          LIBSODIUM_PREFIX="$HOME/.cache/iog-libsodium-dbb48cce"
          sudo mkdir -p /usr/local/lib /usr/local/include
          sudo cp -a --no-preserve=ownership "$LIBSODIUM_PREFIX/lib/." /usr/local/lib/
          sudo cp -a --no-preserve=ownership "$LIBSODIUM_PREFIX/include/." /usr/local/include/
          sudo ldconfig
          nm -D /usr/local/lib/libsodium.so | grep -E ' T crypto_vrf_ietfdraft03_proof_to_hash$' >/dev/null
          nm -D /usr/local/lib/libsodium.so | grep -E ' T crypto_vrf_ietfdraft03_verify$' >/dev/null

      - name: Check formatting and run backend tests
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: ./gradlew ktlintCheck test --continue --build-cache --stacktrace

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-gradle-reports
          path: |
            build/reports/ktlint/
            build/reports/tests/
            build/reports/problems/
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: Build, Lint & Test
    needs: [frontend, backend, osv-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Verify upstream jobs succeeded
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          OSV_RESULT: ${{ needs.osv-scan.result }}
        run: |
          echo "Frontend job result: ${FRONTEND_RESULT}"
          echo "Backend job result: ${BACKEND_RESULT}"
          echo "OSV scan job result: ${OSV_RESULT}"
          if [ "${FRONTEND_RESULT}" != "success" ] || [ "${BACKEND_RESULT}" != "success" ] || [ "${OSV_RESULT}" != "success" ]; then
            echo "::error::Upstream CI job did not succeed (frontend=${FRONTEND_RESULT}, backend=${BACKEND_RESULT}, osv-scan=${OSV_RESULT})."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: vue/dist

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build bootJar
        env:
          GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        run: ./gradlew bootJar -PprebuiltFrontend=true --build-cache --stacktrace
