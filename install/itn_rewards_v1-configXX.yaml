---
log:
  - format: plain
    level: info
    output: stderr
p2p:
  listen_address: "/ip4/0.0.0.0/tcp/33<pid>"
  public_address: "/ip4/<public_ip>/tcp/33<pid>"
  public_id: <public_id_prefix><public_id_suffix>
  topics_of_interest:
    blocks: high
    messages: high
  max_connections: 512
  max_unreachable_nodes_to_connect_per_event: 0
  gossip_interval: "10s"
  policy:
    quarantine_duration: "5m"
  trusted_peers:
